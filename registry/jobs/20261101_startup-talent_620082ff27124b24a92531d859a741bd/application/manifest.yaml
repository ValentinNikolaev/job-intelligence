          snapshots on ticket open/close → Eval JSON.

          - Built email and product-ticket categorization on prompts; retro-mapped
          500+ product tickets and all emails since Jan 2026 as training/eval data.

          - Fixed 15+ production defects in the AI path (swallowed non-2xx Intercom
          responses, nil-error wrapping, malformed session data, content_filter errors,
          duplicate handling, language misdetection).

          - Migrated 3 services to DeepL without language detection.

          - Working set in production: ~7,000 pending tickets in a 7-day window.'
