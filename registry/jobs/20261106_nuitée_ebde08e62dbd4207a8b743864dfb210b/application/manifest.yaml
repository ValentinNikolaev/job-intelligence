    - id: simple-2026-telephony-privacy
      employer: Simple.life
      role: Software Developer
      source:
        path: registry/candidate/user-confirmed-simple-life-telephony-2026-09-27.md
        quote: "## Context and ownership\n\nSimple operates in the medical and health\
          \ domain, including clinic callback requests;\nevery call carries PII and\
          \ potentially PHI. The candidate owned the architecture and\nbackend end\
          \ to end, authored the epic and design document and made the security\n\
          decisions. The work passed formal security sign-off (DEV-35381) and a BAA\
          \ and\ncall-recording compliance review (DEV-35382), then reached production\
          \ on 2026-09-25\nwith a three-person cross-functional team: backend, frontend\
          \ and SRE.\n\n## Verified privacy, access and audit design\n\n- The customer\
          \ phone number was resolved server-side, never returned by the API,\n  rendered\
