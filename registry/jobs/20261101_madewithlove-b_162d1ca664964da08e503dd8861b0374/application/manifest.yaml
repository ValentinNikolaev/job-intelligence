          - Code: 1,670 → 800 LOC (−52%). Tests: 1 of 3 → 3 of 3 processes covered.
          Removed a hard cap of 100 items/day. Eliminated daily full-history re-reads
          from Snowflake. No public API / admin-UI changes; no downtime.'
