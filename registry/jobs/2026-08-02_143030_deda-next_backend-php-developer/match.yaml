  for Rome and whether remote-first flexibility is possible.
- Work authorization, notice period, earliest start date, and compensation expectations
  remain TODO_CONFIRM in the candidate profile.
- The application should position the candidate as a senior backend engineer who can
  contribute at PHP/API/database depth without overstating direct public-administration
