    - id: simple-2026-cron-resilience
      employer: Simple.life
      role: Software Developer
      source:
        path: registry/candidate/user-confirmed-simple-life-2026-09-26.md
        quote: '**E. Elimination of daily cron fatal failures under Intercom API degradation
          (Jul–Aug 2026)**

          - Diagnosed from logs and code: up to 14 fatal runs/day; a 48-page scan
          of ~7,000 tickets exceeded the 19.5-minute run budget when Intercom search
          degraded; per-page retry was bypassed by the overall-context-done branch.

          - Fix: partial-success semantics with an "incomplete scan" metric instead
          of fatal; sharded search by updated_at with 3–4 parallel cursor chains.'
        sha256: ef83405695384f312ee27ff2ec9e846d8796c42409483c352ff7f72d6accd586
