      employer: Simple.life
      role: Software Developer
      support:
        contribution:
          evidence_id: simple-2026-snowflake-pipelines
          quote: '**D. Consolidation of three Snowflake→Intercom pipelines into one
            engine (Sep 2026)**

            - Researched the codebase, proved ~70% structural identity, replaced 3
            independent cron pipelines (CEO questions, profile reports, deletion feedback)
            with one two-phase engine (ingest + push; keyset pagination, run budget,
            throttle, retries, feature flag) via Template Method with 6 hook points.

            - Code: 1,670 → 800 LOC (−52%). Tests: 1 of 3 → 3 of 3 processes covered.
            Removed a hard cap of 100 items/day. Eliminated daily full-history re-reads
            from Snowflake. No public API / admin-UI changes; no downtime.'
