    - document: cv
      text: building vendor-neutral integrations
      evidence_ids:
      - simple-2026-helpdesk-gateway
      support:
        contribution:
          evidence_id: simple-2026-helpdesk-gateway
          quote: '**B. Multi-tenant helpdesk gateway, built from scratch (Jul–Aug
            2026)**

            - New Go service abstracting helpdesk vendors (Intercom, Zendesk) behind
            a vendor-neutral event model; the only repo holding vendor SDKs.

            - Delivered: domain model, OpenAPI contracts + inbound event schema, webhook
            ingestion with per-tenant store and SQS queues (IRSA), Intercom adapter,
            Zendesk adapter with full outbound (reply, note, tags, status), client
            + service in the support-agent, dev environment and deploy.

            - Enabled the company''s first B2B demo of the support-AI product (golden
            cases + admin console).'
