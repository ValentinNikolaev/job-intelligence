          - Built the deletion-request predictor (OpenAI classifier) and hardened
          it against moderation failures and mapping errors; routed users with active
          deletion requests to L1.

          - Preprocessing pipeline: stop-word cleanup for cancellations/refunds, text
          sanitization for both automation services, removal of boilerplate before
          categorization, CC-contacts support, "get email from inquiry" action, empty-body
          ticket workaround.

          - Fixed 5 production defects in cancellation emails in one release (incorrect
          cancellation/end dates, tags & pending status not applied, missing name
          in AI reply, AI note not sent).'
