      source:
        path: registry/candidate/user-confirmed-simple-life-2026-09-26.md
        quote: '**C. Production LLM support agent — backend lead (whole year, ~60
          tickets)**

          - Implemented 10+ agent action tools: subscription cancel, cancellation
          offer, refund, marketing/Braze unsubscribe, user search (incl. via OpenAI
          vision), attachments extraction, useful-links generation for new billing,
          review processing for a second product.

          - Built the evaluation pipeline: conversation texts + action events + subscription-state
          snapshots on ticket open/close → Eval JSON.

          - Built email and product-ticket categorization on prompts; retro-mapped
          500+ product tickets and all emails since Jan 2026 as training/eval data.

          - Fixed 15+ production defects in the AI path (swallowed non-2xx Intercom
          responses, nil-error wrapping, malformed session data, content_filter errors,
          duplicate handling, language misdetection).

          - Migrated 3 services to DeepL without language detection.

          - Working set in production: ~7,000 pending tickets in a 7-day window.'
        sha256: ef83405695384f312ee27ff2ec9e846d8796c42409483c352ff7f72d6accd586
