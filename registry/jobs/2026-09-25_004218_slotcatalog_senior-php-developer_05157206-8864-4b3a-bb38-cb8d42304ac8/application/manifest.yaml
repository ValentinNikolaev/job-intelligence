      - text: Built a multi-tenant Go helpdesk gateway with vendor-neutral events
          and Intercom/Zendesk adapters, enabling the first B2B demo of the support
          AI product.
        decision: keep
        reason: Separately proves API abstraction and a shipped B2B demo, relevant
          to evolving product-backed data services.
      - text: Consolidated three Snowflake-to-Intercom pipelines into one engine,
          reducing code from 1,670 to 800 lines, testing all three processes and removing
          a 100-item-per-day cap.
        decision: keep
        reason: Shows maintainability, tested consolidation and removal of a delivery
          cap, all with candidate-supplied code figures.
      - text: Resolved recurring fatal cron runs under Intercom API degradation by
          introducing partial-success handling and sharded cursor searches for a backlog
          of about 7,000 tickets.
        decision: keep
        reason: Shows operational diagnosis and failure handling under a degraded
          external API, rather than a generic support duty.
      - text: Automated GDPR data exports across seven sources through a self-service
          admin workflow, replacing manual coordination for request creation and status
          tracking.
        decision: keep
        reason: Shows a distinct compliance workflow spanning data sources without
          claiming an unmeasured time or cost saving.
      - text: Architected an event-driven analytics pipeline with queues and AWS EventBridge;
          DataLake throughput increased by more than 10x under full technical ownership.
        decision: keep
        reason: Leads PHP experience with the strongest confirmed throughput outcome
          and candidate-owned event architecture.
      - text: Kept event delivery reliability above 99.9% through retry and observability
          work on the production analytics pipeline.
        decision: keep
        reason: Adds the separately measured reliability result for production operation;
          this is not another throughput claim.
      - text: Designed versioned event schemas and owned parallel event-version publication
          in production, allowing analytics consumers to move between schemas without
          blocking new events.
        decision: keep
        reason: Shows schema migration judgment and actual parallel event-version
          publication across analytics consumers.
      - text: Owned the production Crutrade integration, including authentication
          and OTP, account linking, collection exchange and purchase-ownership verification.
        decision: keep
        reason: Shows another production integration with security-sensitive authentication
          and ownership verification.
      - text: Reduced setup time for new analytics streams from several days to under
          four hours through modular design.
        decision: keep
        reason: Adds a distinct modular-design efficiency result with a candidate-reviewed
          setup-time figure.
      - text: Reduced peak load on the main database by finding bottlenecks and redistributing
          workload, improving stability during high-traffic periods.
        decision: keep
        reason: Leads airSlate with database load reduction, a direct fit for relational
          performance and stability.
      - text: Built a Laravel/Symfony logger package used across services and aligned
          it with the interservice communication standard.
        decision: keep
        reason: Shows the concrete Laravel/Symfony artifact used across services,
          not merely a framework keyword.
      - text: Diagnosed production issues with logs, monitoring and SRE dashboards,
          then delivered fixes and operational improvements.
        decision: keep
        reason: Adds source-backed incident diagnosis and fixes as a separate operational
          contribution.
      - text: Defined the technology roadmap with the CTO and established the PHP,
