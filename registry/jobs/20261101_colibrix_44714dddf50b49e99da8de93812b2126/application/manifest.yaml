    - document: cv
      text: Delivered GDPR export and deletion automation across product and support
        systems, giving administrators a self-service workflow for requests and status
        tracking.
      evidence_ids:
      - simple-2026-gdpr
      employer: Simple.life
      role: Software Developer
      support:
        contribution:
          evidence_id: simple-2026-gdpr
          quote: '**F. GDPR automation and account-deletion contour (Dec 2025 – Sep
            2026, ~37 tickets)**

            - End-to-end GDPR data-export automation across 7 sources: Users, Payments,
            Data Platform, AppsFlyer, Intercom + support backends, Slack, Snowflake
            analytics (two products). Self-service admin workflow (create / list /
            detail / status).

            - Deletion contour rework: new dp-gdpr-service contract (bulk requestId
            + lookup), rollback on Data Platform when a request is cancelled, cascade
            deletion to Braze and avo-ai, cancellation contract with actor + reason.

            - Executed an under-18 compliance program: account deletion, subscription
            cancellation and refunds after two notification waves.'
