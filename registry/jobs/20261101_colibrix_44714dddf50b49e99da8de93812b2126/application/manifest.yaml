    - document: cv
      text: Implemented backend-owned calling restrictions and opt-out handling, preventing
        provider retries from bypassing customer contact controls.
      evidence_ids:
      - simple-2026-telephony-lawful-calling
      employer: Simple.life
      role: Software Developer
      support:
        contribution:
          evidence_id: simple-2026-telephony-lawful-calling
          quote: "## Lawful calling and delivery controls\n\n- The backend scheduler\
            \ enforced customer-timezone call windows, Sundays and public\n  holidays,\
            \ the do-not-call list and automatic withdrawal of queued callbacks on\n\
            \  opt-out, window closure or hang. Amazon Connect retries were set to\
            \ zero, so built-in\n  retries could not bypass these controls.\n- The\
            \ call outcome was written to the existing Intercom ticket, with no duplicate\
            \ ticket\n  or duplicate PII record.\n"
