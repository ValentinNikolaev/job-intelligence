    - id: simple-2026-telephony-lawful-calling
      employer: Simple.life
      role: Software Developer
      source:
        path: registry/candidate/user-confirmed-simple-life-telephony-2026-09-27.md
        quote: "## Lawful calling and delivery controls\n\n- The backend scheduler\
          \ enforced customer-timezone call windows, Sundays and public\n  holidays,\
          \ the do-not-call list and automatic withdrawal of queued callbacks on\n\
          \  opt-out, window closure or hang. Amazon Connect retries were set to zero,\
          \ so built-in\n  retries could not bypass these controls.\n- The call outcome\
          \ was written to the existing Intercom ticket, with no duplicate ticket\n\
          \  or duplicate PII record.\n"
        sha256: 0271f8222f33efe96d36f867c3ac11c111f5238a2bd23e956b616d50318b38a5
        context_quote: "Employer: Simple.life / Simple App  \nRole: Software Developer\n"
