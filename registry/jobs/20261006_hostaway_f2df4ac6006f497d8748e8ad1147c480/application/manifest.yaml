      source:
        path: registry/candidate/user-supplied-simple-life-2025-2026-09-26.md
        quote: '**F. Cost optimization and platform hygiene**

          - Admin panel cost optimisation (epic DEV-20905): load only the last 40
          days of customer events on first open; capped the Data Platform events loop
          at 1 year; stopped loading events for tickets handled by the LLM engine
          unless escalated to L1.

          - Dropped the Zendesk usecase and all methods depending on it (Apr 2025);
          removed unused refund threads and outdated cron commands; unified the tagging
          system in support-api; migrated legacy support service onto shared packages
          (Nov 2025); fixed linter in CI; upgraded Go to 1.22.10.

          - Moved OpenAI integration into the support-automation service; introduced
          feature flags; replaced link generation and user lookup in the API with
          calls to the automation service (Support API v2).'
