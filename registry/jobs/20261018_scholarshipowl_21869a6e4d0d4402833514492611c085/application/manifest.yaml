      text: production AI automation.
      evidence_ids:
      - simple-2025-llm-support
      support:
        contribution:
          evidence_id: simple-2025-llm-support
          quote: '**A. LLM-powered cancellation & refund automation for support emails
            (Mar–Sep 2025, epic DEV-21969)**

            - Built OpenAI-generated replies for step 1 of the cancellation workflow
            (regular subscriptions), then turned AI replies on for cancellation emails
            at the first step (Jun 2025); added 1-step automation for refunds over
            30 days; reworked the refund flow after cancellation.

            - Prompt engineering and iteration: cancellation prompts (regular plans),
            deletion-request predictor, TrustPilot prompts, 4-5★ and 1-3★ review prompts;
            migrated all prompts from GPT-4 to GPT-4o (May 2025).

            - Built the deletion-request predictor (OpenAI classifier) and hardened
            it against moderation failures and mapping errors; routed users with active
            deletion requests to L1.

            - Preprocessing pipeline: stop-word cleanup for cancellations/refunds,
            text sanitization for both automation services, removal of boilerplate
            before categorization, CC-contacts support, "get email from inquiry" action,
            empty-body ticket workaround.

            - Fixed 5 production defects in cancellation emails in one release (incorrect
            cancellation/end dates, tags & pending status not applied, missing name
            in AI reply, AI note not sent).'
