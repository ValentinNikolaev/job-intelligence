    - document: cv
      text: Protected caller information in a production health-related calling platform
        by keeping numbers server-side and masked in the agent interface, with no
        number returned by the API or written to logs.
      evidence_ids:
      - simple-2026-telephony-privacy
      support:
        contribution:
          evidence_id: simple-2026-telephony-privacy
          quote: "## Context and ownership\n\nSimple operates in the medical and health\
            \ domain, including clinic callback requests;\nevery call carries PII\
            \ and potentially PHI. The candidate owned the architecture and\nbackend\
            \ end to end, authored the epic and design document and made the security\n\
            decisions. The work passed formal security sign-off (DEV-35381) and a\
            \ BAA and\ncall-recording compliance review (DEV-35382), then reached\
            \ production on 2026-09-25\nwith a three-person cross-functional team:\
            \ backend, frontend and SRE.\n\n## Verified privacy, access and audit\
            \ design\n\n- The customer phone number was resolved server-side, never\
            \ returned by the API,\n  rendered in the agent UI or written to logs;\
            \ only a mask reached the browser. There\n  was no number-reveal UI.\n"
