      employer: Simple.life
      role: Software Developer
      source:
        path: registry/candidate/user-confirmed-simple-life-2026-09-26.md
        quote: '**A. Outbound telephony platform on Amazon Connect (Aug–Sep 2026)**

          - Owned architecture and backend end-to-end; wrote the epic/design doc;
          passed security sign-off; released to production on 2026-09-25.

          - Agent federation via AssumeRole + GetFederationToken: no per-agent AWS
          accounts, no SAML app, IT removed from the critical path.

          - Connect users created lazily by the backend (moved out of Terraform);
          stale users cleaned by cron; admin activate/deactivate.

          - PII controls: customer phone number never rendered or logged (masked only),
          purged from contact record by TTL, DevTools disabled by policy.

          - Compliance logic: call windows with timezones/Sundays/holidays, do-not-call
          list, queued-callback withdrawal on opt-out, retry policy owned by backend
          (Connect retries = 0), outcome written to the existing Intercom ticket (no
          duplicate tickets).

          - Designed load: 10–20 calls/day per agent, max 50. Cross-functional team:
          backend (Valentin), frontend, SRE.

          - Authored a 30-scenario telephony QA checklist with run journal; 4 documented
          runs in 2 days before launch; every finding converted to a ticket.'
