    to about 3 million; preserve this historical source but do not use it for claims.
- id: linkedin-simple-app
  employer: Simple App
  role: Software Developer
  source:
    path: registry/candidate/linkedin-profile.md
    quote: "### Simple App\n\n**Software Developer**  \nNovember 2023 - Present (2\
      \ years 5 months)\n\nI design and own a support automation platform that connects\
      \ Zendesk, Intercom, and\ninternal services through a robust, scalable backend\
      \ in Go. My work enables the support\nteam to operate faster, smarter, and at\
      \ scale - even during peak loads.\n\n- Engineer a unified API orchestration\
      \ layer to streamline ticket routing,\n  classification, and lifecycle tracking.\n\
      - Integrate OpenAI-powered auto-triage flows, resulting in the automated handling\
      \ or\n  deflection of up to 30% of inbound tickets.\n- Migrate business-critical\
      \ flows from Zendesk to Intercom's real-time engine,\n  reducing first-response\
      \ time by 35% and improving resolution rate by 28%.\n- Build resilient message\
      \ delivery pipelines with fallback logic, retries, and\n  monitoring - reducing\
      \ incident-related disruptions by over 50%.\n- Maintain high service uptime\
      \ and throughput without adding team capacity, enabling\n  the support org to\
      \ scale under pressure.\n- Collaborate cross-functionally with Support Ops,\
      \ Product, and AI teams to align\n  automation with measurable impact.\n\nThe\
      \ system now supports tens of thousands of user interactions per month with\
      \ minimal\nhuman intervention, ensuring continuity, speed, and reliability in\
      \ customer\ncommunication."
    sha256: 7b2d96ec997c252ab641d3dd579b66c52fb65827f6abbb022a45886616ec709f
  review_notes: Review chronology against user-confirmed-career-clarifications.md;
    imported Present dates and differing metrics require reconciliation before use.
  status: unverified
- id: linkedin-crurated
  employer: CRURATED
  role: Software Developer
  source:
    path: registry/candidate/linkedin-profile.md
    quote: "### CRURATED\n\n**Software Developer**  \nAugust 2024 - January 2026 (1\
      \ year 6 months)  \nRome, Latium, Italy\n\nI architect and lead the development\
      \ of the platform's internal event analytics\ninfrastructure - a mission-critical\
      \ system that powers product metrics, reporting, and\nbusiness insights.\n\n\
      - Architect a scalable, event-driven system using queues and EventBridge, increasing\n\
      \  throughput to the DataLake by over 10x.\n- Define a robust, versioned event\
      \ schema to enforce consistency across teams and\n  accelerate integration of\
      \ new event types.\n- Reduce implementation time for new analytics streams from\
      \ several days to under\n  4 hours through modular design.\n- Build routing\
      \ logic supporting multiple downstreams (e.g., Webhook, S3) with strong\n  delivery\
      \ guarantees and backpressure handling.\n- Implement fault-tolerant pipelines\
      \ with automatic retries and observability,\n  maintaining event delivery reliability\
      \ above 99.9%.\n- Collaborate with product and engineering leadership to ensure\
      \ end-to-end visibility\n  of critical user and business flows.\n\nThis system\
      \ now serves as the backbone for data-driven decision-making across the\ncompany."
    sha256: 7b2d96ec997c252ab641d3dd579b66c52fb65827f6abbb022a45886616ec709f
