- id: cv-simple-life
  employer: Simple.life
  role: Software Developer
  source:
    path: registry/candidate/backend-engineer-cv.md
    quote: "### Simple.life\n\n**Software Developer**  \nNovember 2023 - March 2026\n\
      \nSimple develops a subscription-based digital health platform focused on nutrition,\n\
      healthy routines, weight management, tracking tools, and an AI coach.\n\n- Designed\
      \ and owned a Go-based support automation platform connecting **Zendesk**,\n\
      \  **Intercom**, and internal services.\n- Integrated **OpenAI**-powered auto-triage\
      \ flows, automating or deflecting up to\n  **30%** of inbound tickets.\n- **Migrated**\
      \ business-critical support flows from **Zendesk** to **Intercom's**\n  real-time\
      \ engine, improving routing speed, handling consistency, and operational\n \
      \ responsiveness.\n- **Built** resilient message delivery pipelines with fallback\
      \ logic, retries, and\n  monitoring to improve communication reliability during\
      \ incidents and peak load.\n- **Contributed** to an LLM-assisted support agent\
      \ for email and multilingual\n  workflows, helping the support team expand automation\
      \ coverage and ship new support\n  scenarios with less engineering involvement.\n\
      \n**Skills:** Go | OpenAI | Support Automation | Backend Integrations | Monitoring\
      \ |\nREST APIs | System Design"
    sha256: 9ecd2d343f2504635b9f8faa62a62bf6f96b5afe74b894f4daaaff8deaa95c9a
  review_notes: Review chronology against user-confirmed-career-clarifications.md;
    imported Present dates and differing metrics require reconciliation before use.
  status: unverified
- id: cv-airslate
  employer: airSlate
  role: Software Developer
  source:
    path: registry/candidate/backend-engineer-cv.md
    quote: "### airSlate\n\n**Software Developer**  \nFebruary 2021 - August 2023\n\
      \nAirSlate is a global SaaS technology company specialized in no-code business\
      \ process\nautomation, document management, and e-signature solutions.\n\n-\
      \ **Reduced** peak load on the main database by removing bottlenecks and\n \
      \ redistributing workload, improving service stability during high-traffic periods.\n\
      - **Investigated** and addressed API and query performance bottlenecks across\
      \ backend\n  services.\n- **Migrated** services from **ECS** to **Kubernetes**\
      \ and prepared the runtime stack\n  for Kubernetes deployments with **Helm**,\
      \ **GitHub Actions**, and **ArgoCD**.\n- Implemented **CI/CD pipelines** that\
      \ shortened release cycles and improved delivery\n  consistency across services.\n\
      - **Troubleshot** production issues using logs, monitoring, and SRE dashboards;\n\
      \  delivered fixes and operational improvements.\n\n**Skills:** PHP | Laravel\
      \ | MySQL | Elasticsearch | RabbitMQ | AWS | Kubernetes |\nPrometheus | REST\
      \ APIs | CI/CD"
