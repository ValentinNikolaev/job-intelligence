    path: registry/candidate/linkedin-profile.md
    quote: "### CRURATED\n\n**Software Developer**  \nAugust 2024 - January 2026 (1\
      \ year 6 months)  \nRome, Latium, Italy\n\nI architect and lead the development\
      \ of the platform's internal event analytics\ninfrastructure - a mission-critical\
      \ system that powers product metrics, reporting, and\nbusiness insights.\n\n\
      - Architect a scalable, event-driven system using queues and EventBridge, increasing\n\
      \  throughput to the DataLake by over 10x.\n- Define a robust, versioned event\
      \ schema to enforce consistency across teams and\n  accelerate integration of\
      \ new event types.\n- Reduce implementation time for new analytics streams from\
      \ several days to under\n  4 hours through modular design.\n- Build routing\
      \ logic supporting multiple downstreams (e.g., Webhook, S3) with strong\n  delivery\
      \ guarantees and backpressure handling.\n- Implement fault-tolerant pipelines\
      \ with automatic retries and observability,\n  maintaining event delivery reliability\
      \ above 99.9%.\n- Collaborate with product and engineering leadership to ensure\
      \ end-to-end visibility\n  of critical user and business flows.\n\nThis system\
      \ now serves as the backbone for data-driven decision-making across the\ncompany."
    sha256: 7b2d96ec997c252ab641d3dd579b66c52fb65827f6abbb022a45886616ec709f
