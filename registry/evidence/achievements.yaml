- id: cv-pdffiller
  employer: PDFfiller
  role: Software Developer
  source:
    path: registry/candidate/backend-engineer-cv.md
    quote: "### PDFfiller\n\n**Software Developer**  \nOctober 2016 - November 2019\n\
      \nFounding member of the in-product backend team responsible for high-volume\n\
      transactional and lifecycle email systems.\n\n- **Led a team of 5 backend engineers\
      \ developing a transactional email service.**\n- **Scaled** the service to around\
      \ **50 million** emails per month.\n- Made key technical decisions and built\
      \ deep expertise in email infrastructure,\n  including **DNS**, **DKIM**, **SPF**,\
      \ **DMARC**, and **FBLs**.\n- Led the team through **BFCM** peak periods with\
      \ more than **10x** traffic growth.\n\n**Skills:** PHP | Laravel | MySQL | Elasticsearch\
      \ | RabbitMQ | AWS | Email\nInfrastructure | REST APIs | SRE"
