version: 1
timeout_seconds: 12

# Jobicy allows up to 100 results per query. geo, industry, and tag values are
# passed through unchanged; use current Jobicy taxonomy slugs in your profiles.
queries:
  - geo: italy
    industry: dev
    count: 50

  - geo: europe
    industry: dev
    tag: backend
    count: 50

  - geo: europe
    industry: dev
    tag: golang
    count: 50

  - geo: europe
    industry: dev
    tag: php
    count: 50
