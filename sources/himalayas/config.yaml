# Himalayas is a free public API and requires no API key.
version: 1
timeout_seconds: 12

# Search results use 1-based pages. Each query can override this with max_pages.
max_pages_per_query: 1

queries:
  - q: "backend engineer"
    country: "IT"
    exclude_worldwide: true
    seniority: "Senior"
    sort: "recent"
    max_pages: 1

  - q: "golang"
    country: "IT"
    exclude_worldwide: true
    seniority: "Senior"
    sort: "recent"
    max_pages: 1

  - q: "php backend"
    country: "IT"
    exclude_worldwide: true
    seniority: "Senior"
    sort: "recent"
    max_pages: 1

  - q: "technical lead"
    country: "IT"
    exclude_worldwide: true
    seniority: "Manager"
    sort: "recent"
    max_pages: 1
