version: 1
timeout_seconds: 30

# Greenhouse boards expose all public jobs. Keep remote engineering roles whose
# declared location covers the target market.
filters:
  remote_only: true
  location_terms:
    - Italy
    - Europe
    - European Union
    - EMEA
  title_terms:
    - backend
    - backend architect
    - golang
    - go engineer
    - go developer
    - laravel
    - php
    - software architect
    - software engineer
    - software developer
    - platform engineer
    - cloud engineer
    - infrastructure engineer
    - site reliability
    - SRE
    - technical lead
    - tech lead
    - engineering lead
    - engineering manager
    - lead engineer
    - senior engineer
    - staff engineer
    - principal engineer

boards:
  - token: whitetech
    company: WhiteTech
    location_from_description: true
  - token: grafanalabs
    company: Grafana Labs
  - token: cloudflare
    company: Cloudflare
  - token: faire
    company: Faire
  - token: abnormalsecurity
    company: Abnormal Security
  - token: cloudbeds
    company: Cloudbeds
