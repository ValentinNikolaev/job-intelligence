name: Job Intelligence Telegram Delivery

on:
  push:
    branches: [main]
    paths:
      - "notifications/telegram/outbox/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-telegram-delivery
  cancel-in-progress: false

jobs:
  deliver:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install project
        run: python -m pip install -e .

      - name: Deliver queued notifications
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Valentin Nikolaev"
          git config user.email "435393+ValentinNikolaev@users.noreply.github.com"

          mapfile -d '' files < <(find notifications/telegram/outbox -maxdepth 1 -type f -name '*.json' -print0 | sort -z)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Telegram notifications are queued." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          for file in "${files[@]}"; do
            notification_id="$(basename "$file" .json)"
            python scripts/deliver_telegram_outbox.py \
              --outbox-file "$file" \
              --sent-dir notifications/telegram/sent \
              --receipt-dir notifications/telegram/receipts

            git add notifications/telegram
            git commit \
              -m "Record Telegram delivery ${notification_id:0:12}" \
              -m "Delivered by ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}." \
              -m "Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

            for attempt in 1 2 3; do
              if git push origin HEAD:main; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then
                echo "Telegram delivery was sent but its receipt could not be pushed." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
              git fetch origin main
              git rebase origin/main
            done
            echo "- Delivered ${notification_id}" >> "$GITHUB_STEP_SUMMARY"
          done
