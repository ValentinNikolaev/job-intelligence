name: Job Intelligence Archive Skipped

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-archive-skipped
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Archive skipped vacancies
        run: python scripts/archive_jobs.py skipped
      - name: Commit archive
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No skipped archive required."
            exit 0
          fi
          git config user.name "Valentin Nikolaev"
          git config user.email "435393+ValentinNikolaev@users.noreply.github.com"
          git add -A archives registry/jobs
          changed_files="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          archived_vacancies="$(git diff --cached --name-status -- archives | awk '$1 == "A" && $2 ~ /\/meta\.yaml$/ { count++ } END { print count + 0 }')"
          removed_active_files="$(git diff --cached --name-status -- registry/jobs | awk '$1 == "D" { count++ } END { print count + 0 }')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git commit \
            -m "chore(archive): move ${archived_vacancies} skipped vacancies" \
            -m "Archived vacancies marked with the skipped status." \
            -m "Changed files: ${changed_files} total; removed active files: ${removed_active_files}." \
            -m "Run: ${run_url}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
