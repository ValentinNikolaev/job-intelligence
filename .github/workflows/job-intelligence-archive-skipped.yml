name: Job Intelligence Archive Skipped

on:
  schedule:
    - cron: "45 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-archive-skipped
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Archive skipped vacancies
        run: python scripts/archive_jobs.py skipped
      - name: Commit archive
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No skipped archive required."
            exit 0
          fi
          git config user.name "Valentin Nikolaev"
          git config user.email "435393+ValentinNikolaev@users.noreply.github.com"
          git add -A archives registry/jobs
          git commit -m "chore: archive skipped vacancies"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"
