name: Job Intelligence Archive Rejected

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-registry-mutation
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MONGODB_URI: ${{ secrets.MONGODB_URI }}
      JOBINTEL_DATABASE_NAME: ${{ vars.JOBINTEL_DATABASE_NAME || 'job_intelligence' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip && python -m pip install -e .
      - name: Select configured storage
        id: storage_backend
        shell: bash
        run: python -c "import yaml; print('name=' + yaml.safe_load(open('config/data-services.yaml'))['storage']['backend'])" >> "$GITHUB_OUTPUT"

      - name: Grant temporary Atlas runner access
        if: steps.storage_backend.outputs.name == 'mongodb'
        id: atlas_access
        env:
          ATLAS_PROJECT_ID: ${{ vars.ATLAS_PROJECT_ID }}
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
        run: python -m jobintel.atlas_network grant

      - name: Verify shared storage before writing
        env:
          JOBINTEL_MONGODB_NETWORK_READY: 'true'
        run: bash .github/scripts/verify-shared-storage.sh

      - name: Archive rejected vacancies
        run: python scripts/archive_jobs.py rejected --keep-items 50
      - name: Commit archive
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No rejected archive required."
            exit 0
          fi
          git config user.name "Valentin Nikolaev"
          git config user.email "435393+ValentinNikolaev@users.noreply.github.com"
          git add -A archives registry/rejected
          changed_files="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          archived_vacancies="$(git diff --cached --name-status -- archives | awk '$1 == "A" && $2 ~ /\/meta\.yaml$/ { count++ } END { print count + 0 }')"
          archived_files="$(git diff --cached --name-status -- archives | awk '$1 == "A" { count++ } END { print count + 0 }')"
          removed_rejected_files="$(git diff --cached --name-status -- registry/rejected | awk '$1 == "D" { count++ } END { print count + 0 }')"
          commit_subject="$(python -m jobintel.commit_messages archive --run-number "${GITHUB_RUN_NUMBER}" --count "${archived_vacancies}" --reason "rejected")"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          git commit \
            -m "${commit_subject}" \
            -m "Archived rejected vacancies above the 50-item retention limit." \
            -m "Changed files: ${changed_files} total; archive files: ${archived_files}; removed rejected files: ${removed_rejected_files}." \
            -m "Run: ${run_url}"
          git push origin "HEAD:${GITHUB_REF_NAME:-main}"

      - name: Revoke temporary Atlas runner access
        if: always() && steps.storage_backend.outputs.name == 'mongodb'
        env:
          ATLAS_PROJECT_ID: ${{ vars.ATLAS_PROJECT_ID }}
          ATLAS_CLIENT_ID: ${{ secrets.ATLAS_CLIENT_ID }}
          ATLAS_CLIENT_SECRET: ${{ secrets.ATLAS_CLIENT_SECRET }}
        run: python -m jobintel.atlas_network revoke
