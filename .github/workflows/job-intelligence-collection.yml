name: Job Intelligence Collection

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-registry-mutation
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOBINTEL_COLLECTION_LIMIT: ${{ vars.JOBINTEL_COLLECTION_LIMIT || '100' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run deterministic collection workflow
        id: deterministic
        shell: bash
        run: |
          set +e
          hard_failure=0
          soft_failure=0

          run_and_report() {
            local label="$1"
            local failure_mode="$2"
            shift
            shift
            echo "## ${label}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            echo "+ $*" >> "$GITHUB_STEP_SUMMARY"
            "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            local status=${PIPESTATUS[0]}
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Exit code: ${status}" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              if [ "${failure_mode}" = "soft" ]; then
                soft_failure=1
                echo "::warning title=${label} failed::Continuing because collection sources can have transient network/API failures; deterministic checks still gate commits."
              else
                hard_failure=1
              fi
            fi
          }

          run_and_report "Collect vacancies" soft python run.py all --lock-timeout-seconds 3600
          run_and_report "Regenerate registry index" hard python run.py reindex
          run_and_report "Write deterministic triage" hard python run.py triage --lock-timeout-seconds 3600
          run_and_report "Regenerate vacancy catalog" hard python run.py catalog
          run_and_report "Run unit tests" hard env -u TELEGRAM_BOT_TOKEN -u TELEGRAM_CHAT_ID python -m unittest discover -v
          run_and_report "Run repository doctor" hard python run.py doctor --ci
          run_and_report "Workflow summary" hard python run.py api workflow-summary --json
          run_and_report "Workflow limits" hard python run.py api workflow-limits --json
          run_and_report "Analyze queue" hard python run.py api queues analyze --json --limit 30
          run_and_report "Preparation queue" hard python run.py api queues prepare --json --limit 10
          run_and_report "Source API usage" hard python run.py api source-usage --json
          run_and_report "Top vacancies" hard python run.py top 10

          echo "failure=${hard_failure}" >> "$GITHUB_OUTPUT"
          echo "soft_failure=${soft_failure}" >> "$GITHUB_OUTPUT"

      - name: Commit deterministic changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.deterministic.outputs.failure }}" = "1" ]; then
            echo "Deterministic checks failed; refusing to commit generated changes." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "Valentin Nikolaev"
          git config user.email "435393+ValentinNikolaev@users.noreply.github.com"
          git add -A
          git diff --cached --stat

          changed_files="$(git diff --cached --name-only | wc -l | tr -d ' ')"
          added_files="$(git diff --cached --name-status | awk '$1 == "A" { count++ } END { print count + 0 }')"
          modified_files="$(git diff --cached --name-status | awk '$1 == "M" { count++ } END { print count + 0 }')"
          deleted_files="$(git diff --cached --name-status | awk '$1 == "D" { count++ } END { print count + 0 }')"
          new_active_vacancies="$(git diff --cached --name-status -- registry/jobs | awk '$1 == "A" && $2 ~ /\/meta\.yaml$/ { count++ } END { print count + 0 }')"
          new_rejected_vacancies="$(git diff --cached --name-status -- registry/rejected | awk '$1 == "A" && $2 ~ /\/meta\.yaml$/ { count++ } END { print count + 0 }')"
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

          git commit \
            -m "chore(collection): refresh registry (${new_active_vacancies} active, ${new_rejected_vacancies} rejected)" \
            -m "Generated by ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER} via ${GITHUB_EVENT_NAME}." \
            -m "Changed files: ${changed_files} total, ${added_files} added, ${modified_files} modified, ${deleted_files} deleted." \
            -m "Run: ${run_url}"

          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after rebasing against origin/${branch}." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed and pushed deterministic collection changes." >> "$GITHUB_STEP_SUMMARY"
