name: Job Intelligence Collection

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: job-intelligence-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    env:
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      JOBINTEL_COLLECTION_LIMIT: ${{ vars.JOBINTEL_COLLECTION_LIMIT || '100' }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Run deterministic collection workflow
        id: deterministic
        shell: bash
        run: |
          set +e
          failure=0

          run_and_report() {
            local label="$1"
            shift
            echo "## ${label}" >> "$GITHUB_STEP_SUMMARY"
            echo '```text' >> "$GITHUB_STEP_SUMMARY"
            echo "+ $*" >> "$GITHUB_STEP_SUMMARY"
            "$@" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
            local status=${PIPESTATUS[0]}
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "Exit code: ${status}" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
            if [ "$status" -ne 0 ]; then
              failure=1
            fi
          }

          run_and_report "Collect vacancies" python run.py all
          run_and_report "Regenerate registry index" python run.py reindex
          run_and_report "Write deterministic triage" python run.py triage
          run_and_report "Regenerate vacancy catalog" python run.py catalog
          run_and_report "Run unit tests" env -u TELEGRAM_BOT_TOKEN -u TELEGRAM_CHAT_ID python -m unittest discover -v
          run_and_report "Run repository doctor" python run.py doctor --ci
          run_and_report "Workflow summary" python run.py api workflow-summary --json
          run_and_report "Workflow limits" python run.py api workflow-limits --json
          run_and_report "Analyze queue" python run.py api queues analyze --json --limit 10
          run_and_report "Priority preparation queue" python run.py api queues prepare-priority --json --limit 10
          run_and_report "Normal preparation queue" python run.py api queues prepare --json --limit 10
          run_and_report "Source API usage" python run.py api source-usage --json
          run_and_report "Top vacancies" python run.py top 5

          echo "failure=${failure}" >> "$GITHUB_OUTPUT"

      - name: Commit deterministic changes
        id: commit
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.deterministic.outputs.failure }}" = "1" ]; then
            echo "Deterministic checks failed; refusing to commit generated changes." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          git status --short
          if [ -z "$(git status --porcelain)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No repository changes to commit." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git commit -m "Update collected vacancies"

          branch="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${branch}"; then
              break
            fi
            if [ "${attempt}" -eq 3 ]; then
              echo "Push failed after rebasing against origin/${branch}." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
          done

          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "Committed and pushed deterministic collection changes." >> "$GITHUB_STEP_SUMMARY"
