name: MongoDB Storage Tests

on:
  push:
    paths: ['jobintel/**', 'tests/**', 'pyproject.toml', '.github/workflows/mongodb-tests.yml', '.github/scripts/start-test-mongodb.sh']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Start isolated replica set
        run: bash .github/scripts/start-test-mongodb.sh
      - name: Run unit and transaction tests without production credentials
        env:
          JOBINTEL_ACCOUNT: current
          JOBINTEL_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
        run: python -m unittest discover -v
      - name: Remove test server
        if: always()
        run: docker rm -f jobintel-test-mongo
