name: MongoDB Storage Tests

on:
  push:
    paths: ['jobintel/**', 'tests/**', 'pyproject.toml', '.github/workflows/mongodb-tests.yml']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Start isolated replica set
        run: |
          docker run -d --name jobintel-test-mongo -p 127.0.0.1:27018:27017 mongo:8.0 --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec jobintel-test-mongo mongosh --quiet --eval 'db.adminCommand({ping:1})'; then break; fi
            sleep 1
          done
          docker exec jobintel-test-mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'
      - name: Run unit and transaction tests without production credentials
        env:
          JOBINTEL_TEST_MONGODB_URI: mongodb://127.0.0.1:27018/?replicaSet=rs0&directConnection=true
        run: python -m unittest discover -v
      - name: Remove test server
        if: always()
        run: docker rm -f jobintel-test-mongo
