schema_version: 1
note: >-
  These settings document which model to select when creating each Codex task.
  Project code cannot switch the active Codex model. The publisher derives its
  provenance label from the explicitly selected workflow.
prepare_min_score: 65
prepare_max_age_days: 7
workflows:
  analyze:
    model: gpt-5.6-luna
    reasoning: low
    model_label: codex:gpt-5.6-luna:low
    purpose: High-volume vacancy scoring and initial selection.
  prepare:
    model: gpt-5.6-terra
    reasoning: medium
    model_label: codex:gpt-5.6-terra:medium
    purpose: >
      Single application package workflow. Prepare only vacancies explicitly
      selected by the user through a vacancy ID or registry directory.
