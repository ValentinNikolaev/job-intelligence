schema_version: 1
note: Bounded phase-3 migration corpus. All names, evidence and vacancies are synthetic.
candidate: 'Alex is a fictional candidate based in Rome, Italy.

  Alex is a senior backend engineer with ten years of verified backend delivery, API
  design and service operation.

  Alex has verified production Go and PHP experience.

  Alex has verified experience building support automation and transactional email
  services.

  Alex speaks English at C1 and Italian at A2, and has no German proficiency.

  Alex has no production Spring Boot or ASP.NET/.NET experience and is willing to
  learn with training.

  Alex can work 09:00-18:00 Europe/Rome and cannot work a full US Pacific workday.

  Alex can attend a local Rome office for a hybrid role.

  Alex prefers remote work; an unknown remote arrangement remains uncertain rather
  than an established conflict.

  Alex prefers relocation assistance but has not made it mandatory.

  Alex has no stated restriction on the commercial domain of a backend role.

  '
cases:
- id: remote-hybrid
  vacancies:
  - id: a
    source: 'Senior backend engineer. Build and operate reliable product services
      and APIs. Demonstrated senior backend delivery and API design are required.
      English C1 is required. Language-specific training is available. No prior experience
      in a particular programming language is mandatory. Based in Rome, Italy. Standard
      European working hours. Hybrid: two days per week in our Rome office.'
  - id: b
    source: Senior backend engineer. Build and operate reliable product services and
      APIs. Demonstrated senior backend delivery and API design are required. English
      C1 is required. Language-specific training is available. No prior experience
